<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Susan 单词打卡闯关</title>
<style>
  :root{
    --pink:#ff6b9d; --pink-light:#ffe3ee; --blue:#4dabf7; --blue-light:#e3f2ff;
    --yellow:#ffd43b; --green:#51cf66; --purple:#9775fa;
    --bg:#fff7fb; --card:#ffffff; --text:#3b3b4f; --muted:#8a8a9e;
    --shadow:0 6px 18px rgba(255,107,157,.15);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  .app{max-width:520px; margin:0 auto; padding:16px 16px 90px;}
  /* ---------- 顶部 ---------- */
  header{
    background:linear-gradient(135deg,var(--pink),#ff8fab 60%,var(--purple));
    border-radius:20px; padding:20px 18px; color:#fff; box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  header::after{content:"❄️"; position:absolute; right:14px; top:12px; font-size:28px; opacity:.5;}
  .hi{font-size:13px; opacity:.9;}
  .streak{font-size:30px; font-weight:800; margin-top:4px;}
  .streak small{font-size:14px; font-weight:500; opacity:.9;}
  .today-bar{margin-top:12px; background:rgba(255,255,255,.25); border-radius:12px; padding:8px 10px; font-size:13px;}
  .bar-track{background:rgba(255,255,255,.35); height:8px; border-radius:6px; margin-top:6px; overflow:hidden;}
  .bar-fill{height:100%; background:#fff; border-radius:6px; transition:width .4s;}
  /* ---------- 日历打卡 ---------- */
  .card{background:var(--card); border-radius:18px; padding:16px; margin-top:14px; box-shadow:var(--shadow);}
  .card h2{font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal .d{
    aspect-ratio:1; border-radius:10px; background:#f4f4f8; display:flex; align-items:center;
    justify-content:center; font-size:12px; color:var(--muted); position:relative;
  }
  .cal .d.done{background:var(--pink); color:#fff; font-weight:700;}
  .cal .d.today{outline:2px solid var(--blue); outline-offset:1px;}
  .cal .d.future{opacity:.45;}
  .cal .wd{font-size:10px; color:var(--muted); text-align:center; padding-bottom:2px;}
  /* ---------- 模式选择 ---------- */
  .modes{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
  .mode{
    border:none; border-radius:18px; padding:16px 12px; cursor:pointer; color:#fff;
    font-size:15px; font-weight:700; text-align:left; box-shadow:var(--shadow);
    transition:transform .15s; font-family:inherit;
  }
  .mode:active{transform:scale(.96);}
  .mode p{font-size:11px; font-weight:400; opacity:.9; margin-top:4px;}
  .m1{background:linear-gradient(135deg,#4dabf7,#74c0fc);}
  .m2{background:linear-gradient(135deg,#51cf66,#8ce99a);}
  .m3{background:linear-gradient(135deg,#9775fa,#b197fc);}
  .m4{background:linear-gradient(135deg,#ffa94d,#ffc078);}
  .m5{background:linear-gradient(135deg,#f59f00,#ffd43b); grid-column:1/-1;}
  /* ---------- 练习界面 ---------- */
  .screen{display:none;}
  .screen.active{display:block;}
  .quiz-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .btn-back{
    border:none; background:#f4f4f8; border-radius:10px; padding:7px 12px; cursor:pointer;
    font-size:13px; color:var(--muted); font-family:inherit;
  }
  .progress-dots{display:flex; gap:5px;}
  .dot{width:10px; height:10px; border-radius:50%; background:#eee;}
  .dot.ok{background:var(--green);} .dot.bad{background:#ff8787;}
  .question-card{
    background:var(--card); border-radius:20px; padding:26px 16px; text-align:center;
    box-shadow:var(--shadow); margin-bottom:14px;
  }
  .q-label{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .q-word{font-size:34px; font-weight:800; letter-spacing:.5px;}
  .q-pho{font-size:14px; color:var(--muted); margin-top:6px;}
  .speak-btn{
    margin-top:12px; border:none; background:var(--blue-light); color:var(--blue);
    border-radius:50px; padding:9px 18px; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .sentence{font-size:14px; color:var(--text); background:#f8f9fb; border-radius:12px; padding:10px 12px; margin-top:14px; line-height:1.6;}
  .sentence b{color:var(--pink);}
  .options{display:grid; gap:10px;}
  .opt{
    border:2px solid #eee; background:var(--card); border-radius:14px; padding:14px;
    font-size:16px; cursor:pointer; text-align:center; font-family:inherit; color:var(--text);
    transition:border-color .15s, background .15s;
  }
  .opt.correct{border-color:var(--green); background:#ebfbf0; color:#2b8a3e; font-weight:700;}
  .opt.wrong{border-color:#ff8787; background:#fff0f0; color:#e03131;}
  .opt:disabled{cursor:default;}
  /* 拼写 */
  .spell-input{
    width:100%; font-size:22px; text-align:center; padding:12px; border-radius:14px;
    border:2px solid #eee; font-family:inherit; letter-spacing:2px; outline:none;
  }
  .spell-input:focus{border-color:var(--blue);}
  .btn-main{
    width:100%; border:none; border-radius:14px; padding:14px; font-size:16px; font-weight:700;
    background:var(--pink); color:#fff; cursor:pointer; margin-top:12px; font-family:inherit;
  }
  /* ---------- 反馈弹层 ---------- */
  .feedback{
    position:fixed; left:0; right:0; bottom:-90px; margin:0 auto; max-width:480px;
    background:var(--card); border-radius:20px 20px 0 0; padding:18px; text-align:center;
    box-shadow:0 -8px 30px rgba(0,0,0,.12); transition:bottom .3s; z-index:50;
  }
  .feedback.show{bottom:0;}
  .fb-title{font-size:22px; font-weight:800;}
  .fb-title.good{color:var(--green);} .fb-title.bad{color:#ff8787;}
  .fb-detail{font-size:14px; color:var(--muted); margin-top:6px; line-height:1.6;}
  .stars{font-size:26px; margin-top:4px;}
  /* ---------- 结算 ---------- */
  .result-emoji{font-size:56px; text-align:center;}
  .result-num{text-align:center; font-size:40px; font-weight:800; margin-top:8px;}
  .result-sub{text-align:center; color:var(--muted); font-size:14px; margin-top:6px;}
  .toast{
    position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-80px);
    background:var(--text); color:#fff; padding:10px 20px; border-radius:50px; font-size:14px;
    transition:transform .3s; z-index:60;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  /* ---------- 词卡切换 ---------- */
  .deck-btn{
    flex:1; border:2px solid #eee; background:#fff; border-radius:14px; padding:12px;
    font-size:15px; font-weight:700; cursor:pointer; color:var(--muted); font-family:inherit;
    transition:all .15s;
  }
  .deck-btn.on{border-color:var(--pink); background:var(--pink-light); color:var(--pink);}
  /* ---------- 家长词库 ---------- */
  .sm-input{
    flex:1; min-width:0; border:2px solid #eee; border-radius:10px; padding:9px 12px;
    font-size:14px; font-family:inherit; outline:none; color:var(--text);
  }
  .sm-input:focus{border-color:var(--blue);}
  .btn-mini{
    border:none; background:var(--pink); color:#fff; border-radius:10px; padding:9px 16px;
    font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .btn-mini.ghost{background:#f4f4f8; color:var(--muted);}
  .btn-mini:active{transform:scale(.96);}
  .cw-tag{
    display:inline-flex; align-items:center; gap:5px; background:#fff; border:2px solid #ffe3ee;
    border-radius:10px; padding:5px 10px; font-size:13px; font-family:inherit; color:var(--text);
  }
  .cw-tag button{
    border:none; background:none; color:#ff8787; cursor:pointer; font-size:14px;
    padding:0 2px; font-family:inherit; line-height:1;
  }
  .rng-btn{
    border:2px solid #eee; background:#fff; border-radius:50px; padding:7px 14px;
    font-size:13px; cursor:pointer; color:var(--muted); font-family:inherit; font-weight:600;
  }
  .rng-btn.on{border-color:var(--blue); background:var(--blue-light); color:var(--blue);}
</style>
</head>
<body>
<div class="app">

  <!-- ====== 首页 ====== -->
  <div class="screen active" id="home">
    <header>
      <div class="hi">❄️ 今天也要开口说英语！</div>
      <div class="streak"><span id="streakNum">0</span><small> 天连续打卡</small></div>
      <div class="today-bar">
        <span id="todayTask">今日目标：完成 8 题打卡</span>
        <div class="bar-track"><div class="bar-fill" id="todayBar" style="width:0%"></div></div>
      </div>
    </header>

    <div class="card">
      <h2>📅 打卡日历 <span style="font-size:12px;color:var(--muted)" id="monthLabel"></span></h2>
      <div class="cal" id="calendar"></div>
      <div style="margin-top:10px;font-size:12px;color:var(--muted);text-align:center">
        ⭐ 总星星：<b id="totalStars">0</b>　🏆 通关次数：<b id="totalRuns">0</b>
      </div>
    </div>

    <div class="card">
      <h2>🃏 词卡选择 <span style="font-size:12px;color:var(--muted)">点右上角切换</span></h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button id="deckSusan" class="deck-btn" onclick="switchDeck('susan')">🥇 第一桶金</button>
        <button id="deckNoun" class="deck-btn" onclick="switchDeck('noun')">⭐ 名词卡</button>
        <button id="deckPhrase" class="deck-btn" onclick="switchDeck('phrase')">💬 场景表达卡</button>
        <button id="deckCustom" class="deck-btn" onclick="switchDeck('custom')">📌 我的词卡</button>
      </div>
      <div id="rangeRow" style="display:none;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="rng-btn" onclick="setRange('all')">全部100词</button>
        <button class="rng-btn" onclick="setRange('1-25')">1-25词</button>
        <button class="rng-btn" onclick="setRange('26-50')">26-50词</button>
        <button class="rng-btn" onclick="setRange('51-75')">51-75词</button>
        <button class="rng-btn" onclick="setRange('76-100')">76-100词</button>
      </div>
    </div>

    <div class="card">
      <h2>✏️ 家长添加单词 <span style="font-size:12px;color:var(--muted)">跟上老师进度，自定义打卡</span></h2>
      <div style="display:flex;gap:8px">
        <input id="cwWord" class="sm-input" placeholder="英文单词，如 apple">
        <input id="cwCn" class="sm-input" placeholder="中文意思，如 苹果">
      </div>
      <input id="cwS" class="sm-input" style="width:100%;margin-top:8px" placeholder="例句（选填，句子里包含这个单词，如：I eat an apple.）">
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
        <button class="btn-mini" onclick="addCustom()">➕ 添加</button>
        <button class="btn-mini ghost" onclick="toggleImport()">📋 批量导入</button>
        <span style="font-size:12px;color:var(--muted)" id="customCount"></span>
      </div>
      <textarea id="cwBatch" class="sm-input" style="display:none;width:100%;margin-top:8px;height:84px;resize:vertical"
        placeholder="每行一个词，用 | 分隔：&#10;apple | 苹果 | I eat an apple.&#10;orange | 橙子"></textarea>
      <button id="cwImportBtn" class="btn-mini" style="display:none;margin-top:8px" onclick="importBatch()">导入以上单词</button>
      <div id="customList" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>

    <div class="card">
      <h2>💾 进度存档 <span style="font-size:12px;color:var(--muted)">换设备/换浏览器时迁移打卡数据</span></h2>
      <div style="display:flex;gap:8px">
        <button class="btn-mini ghost" onclick="exportSave()">📤 导出存档码</button>
        <button class="btn-mini ghost" onclick="toggleSaveBox()">📥 导入存档码</button>
      </div>
      <textarea id="saveBox" class="sm-input" style="display:none;width:100%;margin-top:8px;height:72px;resize:vertical;font-size:12px" placeholder="存档码粘贴在这里"></textarea>
      <button id="saveImportBtn" class="btn-mini" style="display:none;margin-top:8px" onclick="importSave()">恢复以上存档</button>
    </div>

    <div class="modes">
      <button class="mode m1" onclick="startQuiz('recognize')">👀 认词挑战<p>看单词，选意思（8题）</p></button>
      <button class="mode m2" onclick="startQuiz('listen')">👂 听音辨词<p>听发音，选单词（8题）</p></button>
      <button class="mode m3" onclick="startQuiz('spell')">✏️ 拼写闯关<p>听意思，拼单词（6题）</p></button>
      <button class="mode m4" onclick="startQuiz('sentence')">💬 场景造句<p>选词补全Susan句型（6题）</p></button>
      <button class="mode m5" onclick="startQuiz('picture')">🖼️ 看图选词<p>看图片，选对单词（8题）</p></button>
    </div>

    <div class="card">
      <h2>📚 <span id="bankLabel">⭐ 超级名词卡</span> <span style="font-size:12px;color:var(--muted)">点卡片听发音</span></h2>
      <div id="wordBank" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
  </div>

  <!-- ====== 练习页 ====== -->
  <div class="screen" id="quiz">
    <div class="quiz-head">
      <button class="btn-back" onclick="quitQuiz()">← 退出</button>
      <div class="progress-dots" id="dots"></div>
    </div>
    <div class="question-card" id="qCard"></div>
    <div class="options" id="optArea"></div>
    <div id="spellArea" style="display:none">
      <input class="spell-input" id="spellInput" placeholder="在这里拼出单词" autocomplete="off" autocapitalize="off">
      <button class="btn-main" onclick="checkSpell()">提交 ✓</button>
    </div>
  </div>

  <!-- ====== 结算页 ====== -->
  <div class="screen" id="result">
    <div class="card" style="margin-top:30px">
      <div class="result-emoji" id="resEmoji">🎉</div>
      <div class="result-num" id="resScore">8/8</div>
      <div class="result-sub" id="resSub">满分！Susan 会为你骄傲的</div>
      <div style="text-align:center;font-size:22px;margin:10px 0" id="resStars">⭐⭐⭐</div>
      <button class="btn-main" onclick="goHome()">回到主页</button>
    </div>
  </div>
</div>

<div class="feedback" id="fb">
  <div class="fb-title" id="fbTitle">答对啦！</div>
  <div class="stars" id="fbStars">⭐ +1</div>
  <div class="fb-detail" id="fbDetail"></div>
  <button class="btn-main" onclick="nextQuestion()">继续 →</button>
</div>
<div class="toast" id="toast"></div>

/* ================= 状态 ================= */
const KEY = "susan_word_game_v1";
const DAILY_GOAL = 8;
let store = load();
let quiz = null;
let deck = store.deck && BANKS[store.deck] ? store.deck : "susan";
// 一次性迁移：跟随课堂进度，默认切到第一桶金
if(!store.deckV2){
  deck = "susan"; store.deck = "susan"; store.deckV2 = true;
  store.range = store.range || "all";
  save();
}

function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || fresh(); }
  catch(e){ return fresh(); }
}
function fresh(){ return {days:{}, stars:0, runs:0, todayKey:null, todayCount:0, deck:"susan", custom:[], range:"all", deckV2:true}; }
function save(){ localStorage.setItem(KEY, JSON.stringify(store)); }
function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayDiff(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

/* ================= 首页渲染 ================= */
function renderHome(){
  const tk = todayKey();
  // 重置今日计数（换了新的一天）
  if(store.todayKey !== tk){ store.todayKey = tk; store.todayCount = 0; save(); }
  // 连续天数
  let streak = 0, d = new Date();
  // 今天还没打卡时，从昨天开始算
  if(!store.days[tk]) d.setDate(d.getDate()-1);
  while(store.days[fmt(d)]){ streak++; d.setDate(d.getDate()-1); }
  document.getElementById("streakNum").textContent = streak;
  document.getElementById("totalStars").textContent = store.stars;
  document.getElementById("totalRuns").textContent = store.runs;
  const pct = Math.min(100, Math.round(store.todayCount/DAILY_GOAL*100));
  document.getElementById("todayBar").style.width = pct+"%";
  document.getElementById("todayTask").textContent =
    store.todayCount >= DAILY_GOAL ? "✅ 今日打卡完成，明天见！" : `今日目标：完成 ${DAILY_GOAL} 题（${store.todayCount}/${DAILY_GOAL}）`;
  renderCalendar(streak);
  renderWordBank();
  renderCustomList();
}
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function renderCalendar(streak){
  const cal = document.getElementById("calendar");
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  document.getElementById("monthLabel").textContent = `${y}年${m+1}月`;
  const first = new Date(y,m,1);
  const offset = (first.getDay()+6)%7; // 周一开头
  const daysIn = new Date(y,m+1,0).getDate();
  const wds = ["一","二","三","四","五","六","日"];
  let html = wds.map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<offset;i++) html += `<div></div>`;
  for(let i=1;i<=daysIn;i++){
    const key = `${y}-${String(m+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`;
    const cls = ["d"];
    if(store.days[key]) cls.push("done");
    if(i===now.getDate()) cls.push("today");
    if(i>now.getDate()) cls.push("future");
    html += `<div class="${cls.join(" ")}">${i}</div>`;
  }
  cal.innerHTML = html;
}

function renderWordBank(){
  const box = document.getElementById("wordBank");
  document.getElementById("bankLabel").textContent = BANKS[deck].name;
  box.innerHTML = bank().map((it,i)=>
    `<button style="border:2px solid #ffe3ee;background:#fff;border-radius:12px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--text)"
      onclick="speak('${it.w.replace(/'/g,"\\'")}'); this.style.borderColor='var(--pink)'"
      title="${it.cn} · ${it.pho||""}">${EMOJI[it.w] ? EMOJI[it.w]+" " : (deck==="custom" ? "🌟 " : "")}${it.w}</button>`).join("");
}

function switchDeck(name){
  deck = name; store.deck = name; save();
  renderWordBank();
  renderDeckBtns();
  showToast("已切换到：" + BANKS[name].name);
}
function renderDeckBtns(){
  document.getElementById("deckSusan").className = "deck-btn" + (deck==="susan" ? " on" : "");
  document.getElementById("deckNoun").className = "deck-btn" + (deck==="noun" ? " on" : "");
  document.getElementById("deckPhrase").className = "deck-btn" + (deck==="phrase" ? " on" : "");
  document.getElementById("deckCustom").className = "deck-btn" + (deck==="custom" ? " on" : "");
  const row = document.getElementById("rangeRow");
  row.style.display = deck==="susan" ? "flex" : "none";
  if(deck==="susan") renderRange();
}
function renderRange(){
  store.range = store.range || "all";
  document.querySelectorAll(".rng-btn").forEach(b=>{
    const val = b.getAttribute("onclick").match(/'([^']+)'/)[1];
    b.className = "rng-btn" + (store.range===val ? " on" : "");
  });
}
function setRange(r){
  store.range = r; save(); renderRange();
  const label = r==="all" ? "全部100词" : "第"+r.replace("-","~")+"词";
  showToast("打卡范围：" + label);
}

/* ================= 家长词库管理 ================= */
function renderCustomList(){
  store.custom = store.custom || [];
  document.getElementById("customCount").textContent = store.custom.length ? `已存 ${store.custom.length} 个词` : "";
  document.getElementById("customList").innerHTML = store.custom.map((it,i)=>
    `<span class="cw-tag">${EMOJI[it.w]||"🌟"} ${it.w} <small style="color:var(--muted)">${it.cn}</small><button onclick="delCustom(${i})" title="删除">✕</button></span>`).join("");
}
function addCustom(){
  const w = document.getElementById("cwWord").value.trim();
  const cn = document.getElementById("cwCn").value.trim();
  const s  = document.getElementById("cwS").value.trim();
  if(!w || !cn){ showToast("单词和中文意思都要填哦"); return; }
  store.custom = store.custom || [];
  if(store.custom.some(x=>x.w.toLowerCase()===w.toLowerCase())){ showToast(`"${w}" 已经在词库里啦`); return; }
  store.custom.push({w, pho:"", cn, s: s || `Look! It's ${/^[aeiou]/i.test(w)?"an":"a"} ${w} !`, tag:"自定义"});
  save();
  document.getElementById("cwWord").value = "";
  document.getElementById("cwCn").value = "";
  document.getElementById("cwS").value = "";
  renderCustomList();
  document.getElementById("cwWord").focus();
  showToast(`已添加 🌟 ${w}`);
}
function delCustom(i){
  store.custom.splice(i,1);
  save();
  renderCustomList();
}
function toggleImport(){
  const box = document.getElementById("cwBatch");
  const btn = document.getElementById("cwImportBtn");
  const on = box.style.display !== "none";
  box.style.display = on ? "none" : "block";
  btn.style.display = on ? "none" : "inline-block";
}
function importBatch(){
  const raw = document.getElementById("cwBatch").value.trim();
  if(!raw){ showToast("先粘贴单词列表"); return; }
  store.custom = store.custom || [];
  let added = 0, skipped = 0;
  raw.split("\n").forEach(line=>{
    const parts = line.split("|").map(x=>x.trim()).filter(Boolean);
    let w, cn, s;
    if(parts.length >= 2){ w=parts[0]; cn=parts[1]; s=parts[2]||""; }
    else{
      const t = line.trim().split(/\s+/);
      if(t.length < 2) return;
      w = t[0]; cn = t.slice(1).join(" ");
    }
    if(!w || !cn) return;
    if(store.custom.some(x=>x.w.toLowerCase()===w.toLowerCase())){ skipped++; return; }
    store.custom.push({w, pho:"", cn, s: s || `Look! It's ${/^[aeiou]/i.test(w)?"an":"a"} ${w} !`, tag:"自定义"});
    added++;
  });
  save();
  renderCustomList();
  document.getElementById("cwBatch").value = "";
  toggleImport();
  showToast(added ? `导入成功 ${added} 个词${skipped?`，跳过重复 ${skipped} 个`:''}` : "没有读到有效的单词，检查一下格式");
}

/* ================= 进度存档（跨设备迁移） ================= */
function toggleSaveBox(){
  const box = document.getElementById("saveBox");
  const btn = document.getElementById("saveImportBtn");
  const on = box.style.display !== "none";
  box.style.display = on ? "none" : "block";
  btn.style.display = on ? "none" : "inline-block";
}
function exportSave(){
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(store))));
  const box = document.getElementById("saveBox");
  box.style.display = "block";
  document.getElementById("saveImportBtn").style.display = "inline-block";
  box.value = code;
  box.select();
  try{ document.execCommand("copy"); showToast("存档码已复制，微信发给自己即可"); }
  catch(e){ showToast("已生成存档码，请手动复制"); }
}
function importSave(){
  const raw = document.getElementById("saveBox").value.trim();
  if(!raw){ showToast("先粘贴存档码"); return; }
  try{
    const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if(!data.days || !("stars" in data)) throw new Error("bad");
    data.custom = data.custom || [];
    data.range = data.range || "all";
    data.deckV2 = true;
    store = data;
    deck = BANKS[store.deck] ? store.deck : "susan";
    save();
    toggleSaveBox();
    renderHome(); renderDeckBtns();
    showToast("✅ 存档恢复成功，打卡记录都回来了");
  }catch(e){ showToast("存档码无效，检查是否复制完整"); }
}

/* ================= 发音 ================= */
function speak(text){
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.85;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){ showToast("当前设备不支持发音"); }
}

/* ================= 出题 ================= */
function shuffle(a){ return a.sort(()=>Math.random()-0.5); }
/* 按老师进度分段（第一桶金 1-100 词） */
function rangeBank(){
  let b = bank();
  if(deck==="susan" && store.range && store.range!=="all"){
    const parts = store.range.split("-");
    const a = Number(parts[0]), z = Number(parts[1]);
    b = b.filter(x=>x.n>=a && x.n<=z);
  }
  return b;
}
function pick(n){ return shuffle([...rangeBank()]).slice(0,n); }

function startQuiz(mode){
  const conf = {
    recognize:{n:8, label:"看单词，选意思"},
    listen:   {n:8, label:"听发音，选单词"},
    spell:    {n:6, label:"听意思，拼单词"},
    sentence: {n:6, label:"选词补全句型"},
    picture:  {n:8, label:"看图片，选单词"},
  }[mode];
  if(mode==="picture" && deck==="phrase"){
    deck = "noun"; store.deck = "noun"; save();
    renderWordBank(); renderDeckBtns();
    showToast("看图选词需要带图的词卡，已帮你切换 🃏");
  }
  // 看图选词只出配了图的词
  const list = mode==="picture"
    ? shuffle(rangeBank().filter(x=>EMOJI[x.w])).slice(0, conf.n)
    : pick(conf.n);
  if(!list.length){
    showToast(deck==="custom" ? "「我的词卡」还是空的，先在上面添加单词吧 ✏️" : "词库暂时为空");
    return;
  }
  quiz = {mode, list, idx:0, score:0, label:conf.label, results:[]};
  show("quiz");
  renderQuestion();
}

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

function renderQuestion(){
  const q = quiz.list[quiz.idx];
  const numTag = (deck==="susan" && q.n) ? ` · 名词卡第${q.n}词` : "";
  document.getElementById("dots").innerHTML = quiz.list.map((_,i)=>
    `<div class="dot ${i<quiz.idx ? (quiz.results[i]?"ok":"bad") : ""}"></div>`).join("");
  document.getElementById("spellArea").style.display = "none";
  document.getElementById("optArea").style.display = "grid";

  const card = document.getElementById("qCard");
  const opts = document.getElementById("optArea");

  if(quiz.mode==="recognize"){
    card.innerHTML = `<div class="q-label">第 ${quiz.idx+1} 题${numTag} ·这个单词是什么意思？</div>
      <div class="q-word">${q.w}</div><div class="q-pho">${q.pho}</div>
      <button class="speak-btn" onclick="speak('${q.w.replace(/'/g,"\\'")}')">🔊 再听一遍</button>`;
    opts.innerHTML = shuffle([q, ...distract(q)]).map((o,i)=>
      `<button class="opt" onclick="answer(this, ${o.w===q.w})">${o.cn}</button>`).join("");
  }
  else if(quiz.mode==="listen"){
    card.innerHTML = `<div class="q-label">第 ${quiz.idx+1} 题${numTag} ·听发音，选出单词</div>
      <button class="speak-btn" style="font-size:18px;padding:12px 26px" onclick="speak('${q.w.replace(/'/g,"\\'")}')">🔊 点我听发音</button>
      <div class="sentence" style="margin-top:16px">提示意思：${q.cn}</div>`;
    opts.innerHTML = shuffle([q, ...distract(q)]).map(o=>
      `<button class="opt" onclick="answer(this, ${o.w===q.w})">${o.w}</button>`).join("");
    setTimeout(()=>speak(q.w), 300);
  }
  else if(quiz.mode==="spell"){
    card.innerHTML = `<div class="q-label">第 ${quiz.idx+1} 题${numTag} ·拼出这个单词</div>
      <div class="q-word" style="font-size:22px">${q.cn}</div><div class="q-pho">${q.pho}</div>
      <div class="sentence">🔊 <b>点击听发音</b>，再照着拼出来：<button class="speak-btn" style="margin-top:8px" onclick="speak('${q.w.replace(/'/g,"\\'")}')">🔊 发音</button></div>`;
    opts.innerHTML = "";
    document.getElementById("optArea").style.display = "none";
    document.getElementById("spellArea").style.display = "block";
    const inp = document.getElementById("spellInput");
    inp.value = ""; inp.disabled = false;
    setTimeout(()=>speak(q.w), 300);
    setTimeout(()=>inp.focus(), 400);
  }
  else if(quiz.mode==="sentence"){
    // 把例句中目标词挖空，选正确短语/词
    const target = q.w;
    const blanked = q.s.replace(new RegExp(target.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "i"),
      `<span style="color:var(--pink);font-weight:700">_____</span>`);
    card.innerHTML = `<div class="q-label">第 ${quiz.idx+1} 题${numTag} ·补全 Susan 句型</div>
      <div class="sentence" style="font-size:16px">${blanked}</div>
      <div class="q-pho" style="margin-top:8px">句意：${q.cn} 出现在句子里，选哪张卡片？</div>`;
    opts.innerHTML = shuffle([q, ...distract(q)]).map(o=>
      `<button class="opt" style="font-size:15px" onclick="answer(this, ${o.w===q.w})">${o.w}</button>`).join("");
  }
  else if(quiz.mode==="picture"){
    const em = EMOJI[q.w] || "❓";
    card.innerHTML = `<div class="q-label">第 ${quiz.idx+1} 题${numTag} ·这是什么？选出对应的单词</div>
      <div style="font-size:96px; line-height:1.2; margin:8px 0">${em}</div>
      <button class="speak-btn" onclick="speak('${q.w.replace(/'/g,"\\'")}')">🔊 听提示</button>`;
    opts.innerHTML = shuffle([q, ...distract(q)]).map(o=>
      `<button class="opt" onclick="answer(this, ${o.w===q.w})">${o.w}</button>`).join("");
  }
}

function distract(q){
  let pool = bank().filter(x=>x.w!==q.w);
  if(pool.length < 3) pool = pool.concat(NOUN_BANK.filter(x=>x.w!==q.w));
  return shuffle(pool).slice(0,3);
}

function answer(btn, correct){
  const q = quiz.list[quiz.idx];
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  if(correct){
    btn.classList.add("correct");
    quiz.score++; quiz.results.push(true);
    store.stars++; showFB(true, q);
  }else{
    btn.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>{
      if(!b.classList.contains("wrong") && b.textContent=== (quiz.mode==="recognize"? q.cn : q.w)) b.classList.add("correct");
    });
    quiz.results.push(false);
    showFB(false, q);
  }
  quiz.idx++;
  save();
}

function checkSpell(){
  const q = quiz.list[quiz.idx];
  const val = document.getElementById("spellInput").value.trim().toLowerCase();
  const ok = val === q.w.toLowerCase();
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  const inp = document.getElementById("spellInput");
  inp.disabled = true;
  inp.style.borderColor = ok ? "var(--green)" : "#ff8787";
  if(ok){ quiz.score++; quiz.results.push(true); store.stars++; showFB(true,q); }
  else{ quiz.results.push(false); showFB(false,q); }
  quiz.idx++;
  save();
}

/* ================= 反馈与流程 ================= */
function showFB(good, q){
  const fb = document.getElementById("fb");
  const t = document.getElementById("fbTitle");
  t.className = "fb-title " + (good?"good":"bad");
  t.textContent = good ? pickOne(["答对啦！","漂亮！","Perfect!","太厉害了！","You got it!"]) : "再想想哦～";
  document.getElementById("fbStars").textContent = good ? "⭐ +1" : "💪 加油，下一题！";
  document.getElementById("fbDetail").innerHTML =
    `<b>${q.w}</b> — ${q.cn}<br>💬 ${q.s}<br>
     <button class="speak-btn" style="margin-top:8px" onclick="speak('${q.s.replace(/'/g,"\\'")}')">🔊 听整句</button>`;
  if(quiz && quiz.mode==="picture") speak(q.w);
  setTimeout(()=>fb.classList.add("show"), 350);
}
function pickOne(a){ return a[Math.floor(Math.random()*a.length)]; }

function nextQuestion(){
  document.getElementById("fb").classList.remove("show");
  setTimeout(()=>{
    if(quiz.idx >= quiz.list.length) finishQuiz();
    else renderQuestion();
  }, 250);
}

function finishQuiz(){
  const n = quiz.list.length, s = quiz.score;
  const tk = todayKey();
  store.todayCount += s;
  if(store.todayCount >= DAILY_GOAL && !store.days[tk]){
    store.days[tk] = true;
    store.stars += 3; // 打卡奖励
    setTimeout(()=>showToast("📅 打卡成功！奖励 ⭐⭐⭐"), 600);
  }
  store.runs++;
  save();
  show("result");
  document.getElementById("resScore").textContent = `${s}/${n}`;
  const starN = s===n ? 3 : s >= n*0.75 ? 2 : s >= n*0.5 ? 1 : 0;
  document.getElementById("resStars").textContent = "⭐".repeat(starN) + "☆".repeat(3-starN);
  document.getElementById("resEmoji").textContent = starN===3 ? "🏆" : starN>=1 ? "🎉" : "💪";
  document.getElementById("resSub").textContent =
    starN===3 ? "满分！Susan 会为你骄傲的！" :
    starN>=1 ? "不错哦，明天继续保持！" : "没关系，再练一轮就熟了！";
  speak(starN===3 ? "Awesome! You did it!" : "Good job! Keep going!");
}

function quitQuiz(){
  document.getElementById("fb").classList.remove("show");
  quiz = null;
  renderHome();
  show("home");
}
function goHome(){
  renderHome();
  show("home");
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

/* 拼写题回车提交 */
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && document.getElementById("spellArea").style.display==="block"
     && !document.getElementById("spellInput").disabled){
    checkSpell();
  }
});

renderHome();
renderDeckBtns();
</script>
